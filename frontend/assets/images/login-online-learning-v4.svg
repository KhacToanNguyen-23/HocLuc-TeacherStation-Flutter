<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1080" width="960" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4F9BFF"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B1B4D" flood-opacity="0.3"/>
    </filter>
    <filter id="sh2" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0B1B4D" flood-opacity="0.25"/>
    </filter>
    <clipPath id="scene"><circle cx="480" cy="520" r="250"/></clipPath>
    <clipPath id="node"><circle r="56"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="960" height="1080" fill="url(#bg)"/>
  <circle cx="860" cy="140" r="200" fill="#fff" opacity="0.08"/>
  <circle cx="80" cy="900" r="240" fill="#fff" opacity="0.07"/>
  <path d="M0 990 Q240 930 480 985 T960 960 V1080 H0 Z" fill="#0B1B4D" opacity="0.18"/>
  <path d="M0 1030 Q260 985 520 1030 T960 1010 V1080 H0 Z" fill="#0B1B4D" opacity="0.22"/>

  <!-- Connectors -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 13" opacity="0.8" fill="none">
    <path d="M170 300 L480 520"/><path d="M790 300 L480 520"/>
    <path d="M130 650 L480 520"/><path d="M830 670 L480 520"/>
  </g>

  <!-- Center circle -->
  <circle cx="480" cy="520" r="270" fill="#fff" opacity="0.28"/>
  <g filter="url(#sh)"><circle cx="480" cy="520" r="250" fill="#DBEAFE"/></g>
  <g clip-path="url(#scene)">
    <rect x="230" y="270" width="500" height="500" fill="#DBEAFE"/>
    <!-- wall decor: shelf with books -->
    <rect x="270" y="400" width="130" height="10" rx="4" fill="#1E3A8A"/>
    <rect x="282" y="352" width="22" height="48" rx="3" fill="#FB7185"/>
    <rect x="308" y="362" width="18" height="38" rx="3" fill="#FACC15"/>
    <rect x="330" y="346" width="24" height="54" rx="3" fill="#6366F1"/>
    <rect x="358" y="368" width="18" height="32" rx="3" fill="#0EA5E9"/>
    <!-- window -->
    <rect x="574" y="350" width="104" height="96" rx="10" fill="#BAE6FD" stroke="#fff" stroke-width="6"/>
    <path d="M626 350 V446 M574 398 H678" stroke="#fff" stroke-width="5"/>
    <circle cx="650" cy="376" r="10" fill="#FDE68A"/>
    <!-- teacher -->
    <path d="M388 724 Q388 590 480 590 Q572 590 572 724 Z" fill="#FB7185"/>
    <path d="M458 590 L480 626 L502 590 Z" fill="#fff"/>
    <rect x="469" y="556" width="22" height="38" rx="9" fill="#E8B08A"/>
    <path d="M436 536 Q426 470 480 468 Q534 470 524 536 L538 604 Q518 580 516 548 Q500 506 480 506 Q460 506 444 548 Q442 580 422 604 Z" fill="#3F2A1D"/>
    <circle cx="480" cy="528" r="40" fill="#E8B08A"/>
    <path d="M440 520 Q446 486 480 486 Q514 486 520 520 Q504 500 480 500 Q456 500 440 520 Z" fill="#3F2A1D"/>
    <path d="M438 524 Q438 478 480 478 Q522 478 522 524" fill="none" stroke="#1E3A8A" stroke-width="7" stroke-linecap="round"/>
    <rect x="428" y="518" width="16" height="28" rx="8" fill="#1E3A8A"/><rect x="516" y="518" width="16" height="28" rx="8" fill="#1E3A8A"/>
    <path d="M436 544 Q440 574 468 574" fill="none" stroke="#1E3A8A" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="470" cy="574" r="5" fill="#1E3A8A"/>
    <circle cx="465" cy="530" r="3.5" fill="#3F2A1D"/><circle cx="495" cy="530" r="3.5" fill="#3F2A1D"/>
    <path d="M468 546 Q480 556 492 546" fill="none" stroke="#9A3412" stroke-width="3.5" stroke-linecap="round"/>
    <!-- desk + laptop -->
    <rect x="220" y="724" width="520" height="70" fill="#1E40AF"/>
    <rect x="412" y="620" width="136" height="100" rx="10" fill="#94A3B8"/>
    <circle cx="480" cy="670" r="9" fill="#F1F5F9"/>
    <rect x="394" y="716" width="172" height="10" rx="5" fill="#64748B"/>
    <!-- mug -->
    <rect x="626" y="690" width="30" height="32" rx="7" fill="#FACC15"/>
    <path d="M656 698 q14 2 0 18" fill="none" stroke="#FACC15" stroke-width="5"/>
    <path d="M634 680 q-6 -8 0 -14 M646 680 q-6 -8 0 -14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- plant -->
    <rect x="300" y="696" width="34" height="28" rx="6" fill="#FB7185"/>
    <path d="M317 696 Q296 668 300 646 Q320 660 317 696 Z M317 696 Q338 664 340 640 Q318 656 317 696 Z" fill="#60A5FA"/>
  </g>

  <!-- Participant nodes -->
  <g filter="url(#sh2)">
    <g transform="translate(170 300)">
      <circle r="64" fill="#fff"/><circle r="56" fill="#FDE68A"/>
      <g clip-path="url(#node)">
        <path d="M-36 60 Q-36 12 0 12 Q36 12 36 60 Z" fill="#FB7185"/>
        <circle cx="0" cy="-8" r="22" fill="#F1C7A1"/>
        <path d="M-24 -6 Q-28 -38 0 -36 Q28 -38 24 -6 Q14 -22 0 -22 Q-14 -22 -24 -6 Z" fill="#1F2937"/>
        <circle cx="-8" cy="-6" r="2.5" fill="#1F2937"/><circle cx="8" cy="-6" r="2.5" fill="#1F2937"/>
        <path d="M-6 4 Q0 9 6 4" fill="none" stroke="#9A3412" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <circle cx="44" cy="42" r="10" fill="#22C55E" stroke="#fff" stroke-width="4"/>
    </g>
    <g transform="translate(790 300)">
      <circle r="64" fill="#fff"/><circle r="56" fill="#FBCFE8"/>
      <g clip-path="url(#node)">
        <path d="M-36 60 Q-36 12 0 12 Q36 12 36 60 Z" fill="#6366F1"/>
        <circle cx="0" cy="-8" r="22" fill="#E7B58C"/>
        <path d="M-26 -2 Q-30 -40 0 -38 Q30 -40 26 -2 Q22 -14 12 -20 Q-4 -12 -26 -2 Z" fill="#7C2D12"/>
        <circle cx="-8" cy="-6" r="2.5" fill="#1F2937"/><circle cx="8" cy="-6" r="2.5" fill="#1F2937"/>
        <path d="M-6 4 Q0 9 6 4" fill="none" stroke="#9A3412" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <circle cx="44" cy="42" r="10" fill="#22C55E" stroke="#fff" stroke-width="4"/>
    </g>
    <g transform="translate(130 650)">
      <circle r="64" fill="#fff"/><circle r="56" fill="#BAE6FD"/>
      <g clip-path="url(#node)">
        <path d="M-36 60 Q-36 12 0 12 Q36 12 36 60 Z" fill="#F59E0B"/>
        <circle cx="0" cy="-8" r="22" fill="#F4C7A1"/>
        <path d="M-24 -8 Q-26 -36 0 -34 Q26 -36 24 -8 Q10 -24 -24 -8 Z" fill="#92400E"/>
        <circle cx="0" cy="-34" r="9" fill="#92400E"/>
        <circle cx="-8" cy="-6" r="2.5" fill="#1F2937"/><circle cx="8" cy="-6" r="2.5" fill="#1F2937"/>
        <path d="M-6 4 Q0 9 6 4" fill="none" stroke="#9A3412" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(44 -40)"><circle r="14" fill="#2563EB" stroke="#fff" stroke-width="4"/>
        <path d="M-4 5 V-5 M0 5 V-7 M4 5 V-5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g>
    </g>
    <g transform="translate(830 670)">
      <circle r="64" fill="#fff"/><circle r="56" fill="#DDD6FE"/>
      <g clip-path="url(#node)">
        <path d="M-36 60 Q-36 12 0 12 Q36 12 36 60 Z" fill="#60A5FA"/>
        <circle cx="0" cy="-8" r="22" fill="#D9A47A"/>
        <path d="M-22 -10 Q-22 -34 0 -32 Q22 -34 22 -10 Q8 -20 -22 -10 Z" fill="#111827"/>
        <circle cx="-8" cy="-6" r="2.5" fill="#1F2937"/><circle cx="8" cy="-6" r="2.5" fill="#1F2937"/>
        <path d="M-6 4 Q0 9 6 4" fill="none" stroke="#7C2D12" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <circle cx="44" cy="42" r="10" fill="#22C55E" stroke="#fff" stroke-width="4"/>
    </g>
  </g>

  <!-- Floating icons -->
  <g filter="url(#sh2)">
    <g transform="translate(360 150)">
      <circle r="46" fill="#fff"/>
      <circle cy="-6" r="20" fill="#FACC15"/>
      <rect x="-10" y="12" width="20" height="10" rx="3" fill="#CBD5E1"/>
      <path d="M-5 -6 q5 10 10 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(600 140)">
      <circle r="46" fill="#fff"/>
      <rect x="-24" y="-20" width="48" height="34" rx="12" fill="#FB7185"/>
      <path d="M-8 14 L-14 26 L6 14 Z" fill="#FB7185"/>
      <circle cx="-10" cy="-3" r="3.5" fill="#fff"/><circle cx="0" cy="-3" r="3.5" fill="#fff"/><circle cx="10" cy="-3" r="3.5" fill="#fff"/>
    </g>
    <g transform="translate(340 890)">
      <circle r="46" fill="#fff"/>
      <path d="M-30 -14 Q-14 -22 0 -12 V24 Q-14 14 -30 22 Z" fill="#6366F1"/>
      <path d="M30 -14 Q14 -22 0 -12 V24 Q14 14 30 22 Z" fill="#818CF8"/>
    </g>
    <g transform="translate(480 925)">
      <circle r="42" fill="#22C55E"/>
      <path d="M-18 2 l12 12 l24 -28" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(620 890)">
      <circle r="46" fill="#fff"/>
      <g transform="rotate(40)">
        <rect x="-8" y="-28" width="16" height="42" fill="#FACC15"/>
        <path d="M-8 14 L0 30 L8 14 Z" fill="#F4C7A1"/>
        <path d="M-3 24 L0 30 L3 24 Z" fill="#1F2937"/>
        <rect x="-8" y="-36" width="16" height="10" rx="3" fill="#FB7185"/>
      </g>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#fff" opacity="0.7">
    <circle cx="90" cy="120" r="5"/><circle cx="880" cy="520" r="4"/><circle cx="70" cy="470" r="4"/>
    <circle cx="860" cy="880" r="5"/><circle cx="240" cy="200" r="3"/><circle cx="740" cy="190" r="3"/>
  </g>
</svg>

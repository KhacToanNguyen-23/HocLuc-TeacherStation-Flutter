name: teaching_companion
description: Teacher desktop shell with a local Java orchestration service.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  web: ^1.1.1
  webview_windows: 0.4.0
  webview_flutter: 4.14.1
  perfect_freehand: ^2.5.2+1
  pdfrx: ^2.6.5
  file_picker: ^13.1.0
  desktop_drop: ^0.8.4
  archive: ^4.0.0
  crypto: ^3.0.7
  audio_bridge:
    path: plugins/audio_bridge
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.6
  flutter_svg: ^2.0.17
  camera: ^0.12.1
  camera_windows: ^0.3.0
  camera_platform_interface: ^2.14.0
  record: ^7.1.2
  syncfusion_flutter_pdf: ^35.1.40
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pdfium_dart: ^0.3.1
  path: ^1.9.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf

name: teaching_companion
description: Teacher desktop shell with a local Java orchestration service.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  web: ^1.1.1
  webview_windows: 0.4.0
  webview_flutter: 4.14.1
  perfect_freehand: ^2.5.2+1
  pdfrx: ^2.6.5
  file_picker: ^13.1.0
  desktop_drop: ^0.8.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf

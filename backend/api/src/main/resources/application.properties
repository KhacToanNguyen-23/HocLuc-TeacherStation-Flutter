# Exam module is separate from legacy companion JSON data.
spring.datasource.url=${EXAM_DB_URL:jdbc:h2:file:./data/exam-platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${EXAM_DB_USER:sa}
spring.datasource.password=${EXAM_DB_PASSWORD:}
spring.flyway.schemas=exam_platform
spring.flyway.default-schema=exam_platform
exam.storage=${EXAM_STORAGE:./data/exam-sources}
exam.admin.email=${EXAM_ADMIN_EMAIL:}
exam.admin.password=${EXAM_ADMIN_PASSWORD:}

# Develop-style Google WebView profiles can use local exam storage.
app.auth.webview-local.enabled=${APP_WEBVIEW_LOCAL_ENABLED:true}

# Optional server-verified OAuth flow; not required by the local WebView login.
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.auth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://127.0.0.1:47831/api/auth/google/callback}
app.auth.admin-emails=${APP_ADMIN_EMAILS:}

# Separate provider connection; existing WebView/exam login remains unchanged.
# Desktop OAuth client + PKCE, credentials provisioned by the app distributor.
app.integrations.google.client-id=${HOC_LUC_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
app.integrations.google.client-secret=${HOC_LUC_GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
app.integrations.google.redirect-uri=${HOC_LUC_GOOGLE_REDIRECT_URI:http://127.0.0.1:47831/api/integrations/google/callback}
app.integrations.google.encryption-key=${HOC_LUC_GOOGLE_ENCRYPTION_KEY:}

logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([request_id=%X{request_id:-none}]){cyan} %clr([%logger{36}]){blue} - %msg%n%wEx

server.port=47831
server.address=127.0.0.1
spring.application.name=companion-service

# Logging
logging.level.root=INFO
logging.level.vn.teaching=DEBUG

# Max upload and form size
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


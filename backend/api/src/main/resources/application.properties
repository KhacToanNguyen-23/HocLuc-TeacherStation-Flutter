server.port=47831
server.address=127.0.0.1
spring.application.name=companion-service

# Logging
logging.level.root=INFO
logging.level.vn.teaching=DEBUG

# Max upload and form size
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Google OAuth client type must be Desktop app; never commit credentials.
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

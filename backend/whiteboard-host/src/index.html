<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flat whiteboard host</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',sans-serif;color:#173b36;background:#f8f8f3}#board{height:100vh}#setup{position:absolute;inset:0;display:grid;place-items:center;background:#f8f8f3}form{width:min(440px,90vw);background:white;padding:32px;border:1px solid #dedfd4;border-radius:16px}h1{font-size:23px}p{line-height:1.6;color:#63756c}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;width:100%;padding:10px;border:1px solid #ccc;border-radius:7px}button{margin-top:18px;background:#163e35;color:white;cursor:pointer}#message{color:#9a4a29;white-space:pre-wrap}
</style></head><body><div id="board"></div><div id="setup"><form id="join"><h1>Whiteboard từ Flat</h1><p>Host này dùng Fastboard cùng phiên bản trong project Flat. Cần session Netless hợp lệ; không yêu cầu học sinh tham gia phòng này.</p><label>App identifier</label><input id="appId" required autocomplete="off"><label>Room UUID</label><input id="roomId" required autocomplete="off"><label>Room token</label><input id="roomToken" type="password" required autocomplete="off"><label>Region</label><select id="region"><option value="sg">Singapore</option><option value="cn-hz">China</option><option value="us-sv">US</option><option value="in-mum">India</option><option value="gb-lon">UK</option></select><button id="connect">Kết nối bảng</button><p id="message" role="status"></p></form></div><script type="module" src="host.js"></script></body></html>

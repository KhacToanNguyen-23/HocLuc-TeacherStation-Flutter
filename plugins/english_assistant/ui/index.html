<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trợ giảng Tiếng Anh</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/__hocluc_sdk__/liquid-glass.css">
</head>
<body>
  <main class="content-container">
    <header class="header"><h2>Hồ sơ văn bản</h2><span class="badge">Dart · đang phát triển</span></header>
    <label class="input-label" for="source-text">Văn bản cần phân tích</label>
    <textarea id="source-text" rows="5" placeholder="Chọn đoạn trong PDF hoặc dán văn bản vào đây"></textarea>
    <div class="actions"><button id="analyze-button" type="button">Phân tích văn bản</button><span id="status" role="status">Sẵn sàng</span></div>
    <nav id="sections" class="tabs" aria-label="Các mục phân tích">
      <button data-section="overview" class="selected">Tổng quan</button>
      <button data-section="vocabulary">Từ vựng</button>
      <button data-section="grammar">Ngữ pháp &amp; Collocation</button>
      <button data-section="difficulty">Độ khó bài đọc</button>
      <button data-section="sources">Nguồn dữ liệu</button>
    </nav>
    <section id="results" aria-live="polite"><p class="empty">Chọn đoạn văn hoặc nhập nội dung để xem kết quả.</p></section>
  </main>
  <script src="app.js"></script>
</body>
</html>

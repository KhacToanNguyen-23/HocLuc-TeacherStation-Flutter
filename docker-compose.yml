version: '3.8'

services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: hocluc_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=hocluc_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Công cụ quản lý Database qua trình duyệt (Tùy chọn)
  pgadmin:
    image: dpage/pgadmin4
    container_name: hocluc_pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@hocluc.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      - postgres-db
    restart: unless-stopped

volumes:
  pgdata:
    name: hocluc_pgdata

name: Frontend CI (Flutter)

on:
  push:
    branches: [ develop, main, master, feat/new-gg-panel ]
    paths:
      - 'frontend/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'docs/architecture/**'
      - '.agents/rules/plugin_development_rules.md'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ develop, main, master ]
    paths:
      - 'frontend/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'docs/architecture/**'
      - '.agents/rules/plugin_development_rules.md'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter Lint, Browser & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js for Plugin Validation & Browser Tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fast Plugin Validation (Schema v2.1 & .hlep Freshness)
        run: |
          echo "🔍 [Early Gate] Kiểm tra nhanh tính toàn vẹn Plugin và độ tươi của gói .hlep..."
          node ../scripts/validate_plugins.mjs

      - name: Validate Plugin UI Contract
        run: |
          node --test test/e2e_browser/plugin_contract.test.cjs
          node --check ../plugins/english_assistant/ui/app.js
          node --check ../plugins/smart_pen/ui/app.js

      - name: Run Browser Bridge Scripts E2E Test (Node.js)
        run: |
          echo "🔍 [Browser Gate] Chạy kiểm thử tự động Browser Bridge Script..."
          node --test test/e2e_browser/meet_screen_share.test.cjs

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Static Code Quality
        run: flutter analyze --no-fatal-infos

      - name: Enforce Architecture Invariants (12 Invariants - AGENTS.md)
        run: |
          echo "🔍 Kiểm tra 12 bất biến kiến trúc Clean Architecture & Plugin (AGENTS.md)..."
          flutter test test/architecture_test.dart

      - name: Prepare PDFium Native Asset for Flutter Tests
        run: dart run tool/prepare_pdfium_test_assets.dart

      - name: Run Unit & Widget Tests
        run: flutter test

  build-windows-check:
    name: Windows Native Desktop Build Verification
    runs-on: windows-latest
    # Include pull requests so Windows compilation errors are caught before merge.
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Flutter Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Windows Native Compilation (Debug Build)
        run: |
          echo "🔍 [Windows Native Gate] Biên dịch thử nghiệm Flutter Windows Native..."
          flutter build windows --debug

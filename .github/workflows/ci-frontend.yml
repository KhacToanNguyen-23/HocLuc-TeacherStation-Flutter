name: Frontend CI (Flutter)

on:
  push:
    branches: [ develop, main, master ]
    paths:
      - 'frontend/**'
      - 'plugins/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ develop, main, master ]
    paths:
      - 'frontend/**'
      - 'plugins/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js for Plugin Validation
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fast Plugin Validation (Schema v2.1 & .hlep Freshness)
        run: |
          echo "🔍 [Early Gate] Kiểm tra nhanh tính toàn vẹn Plugin và độ tươi của gói .hlep..."
          node ../scripts/validate_plugins.mjs

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Static Code Quality
        run: flutter analyze --no-fatal-infos

      - name: Enforce Plugin Architecture Invariants (AGENTS.md)
        run: |
          echo "🔍 Kiểm tra các bất biến kiến trúc Plugin (AGENTS.md & docs/architecture/plugin-development-guide.md)..."
          flutter test test/architecture_test.dart

      - name: Run Unit & Widget Tests
        run: flutter test
